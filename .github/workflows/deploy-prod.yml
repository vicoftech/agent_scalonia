name: Deploy Production
on:
  push:
    tags: ["v*.*.*"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-east-1
      - run: |
          pip install poetry bedrock-agentcore-starter-toolkit
          poetry install
      - name: Run Alembic migrations (prod)
        run: poetry run alembic upgrade head
        env:
          AURORA_SYNC_SECRET_ARN: ${{ secrets.AURORA_SYNC_SECRET_ARN_PROD }}
          RDS_PROXY_ENDPOINT: ${{ secrets.RDS_PROXY_ENDPOINT_PROD }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - run: terraform -chdir=infrastructure/terraform init -input=false
      - run: terraform -chdir=infrastructure/terraform apply -auto-approve -input=false -var=env=prod
      - run: agentcore deploy --env prod
