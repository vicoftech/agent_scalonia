name: KB Sync
on:
  push:
    branches: [main]
    paths: ["knowledge-base/**"]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - run: aws s3 sync knowledge-base/ s3://prode-knowledge-base-staging/ --delete
      - run: |
          aws lambda invoke \
            --function-name ProdeKBSync-staging \
            --payload '{"source":"github-actions"}' /tmp/out.json
          cat /tmp/out.json
