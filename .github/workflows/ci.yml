name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: snok/install-poetry@v1
        with: { version: "1.8.2" }
      - run: poetry install
      - run: poetry run ruff check agent/ src/ tests/
      - run: poetry run mypy agent/ src/ --ignore-missing-imports
      - run: poetry run pytest --cov=src --cov=agent --cov-report=term-missing --cov-fail-under=80
  terraform-validate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - run: terraform -chdir=infrastructure/terraform init -backend=false -input=false
      - run: terraform -chdir=infrastructure/terraform validate -no-color
        env: { AWS_DEFAULT_REGION: us-east-1 }
