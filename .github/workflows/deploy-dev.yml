# Deploy automático a dev: agente AgentCore + Lambdas (auth OIDC, sin access keys).
name: Deploy Dev

on:
  push:
    branches: [dev, main]
    paths:
      - "agent/**"
      - "infrastructure/lambdas/**"
      - "src/**"
      - "requirements-agent.txt"
      - "pyproject.toml"
      - "poetry.lock"
      - "migrations/**"
      - "alembic.ini"
      - "infrastructure/terraform/**"
      - ".github/workflows/deploy-dev.yml"
      - ".github/workflows/reusable-terraform-apply.yml"
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Ejecutar Alembic antes del deploy
        type: boolean
        default: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - "migrations/**"
              - "alembic.ini"

  deploy:
    needs: changes
    uses: ./.github/workflows/reusable-terraform-apply.yml
    with:
      environment_name: development
      terraform_workspace: dev
      run_alembic: ${{ needs.changes.outputs.migrations == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_migrations) }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_DEV }}
      DEV_TFVARS: ${{ secrets.DEV_TFVARS }}
      AURORA_SYNC_SECRET_ARN: ${{ secrets.AURORA_SYNC_SECRET_ARN_DEV }}
      RDS_PROXY_ENDPOINT: ${{ secrets.RDS_PROXY_ENDPOINT_DEV }}
      TELEGRAM_SECRET_ARN: ${{ secrets.TELEGRAM_SECRET_ARN_DEV }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET_DEV }}
      TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE_DEV }}
