name: Deploy Dev
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region:            us-east-1
      - run: |
          pip install poetry bedrock-agentcore-starter-toolkit
          poetry install
      - name: Run Alembic migrations (dev)
        run: poetry run alembic upgrade head
        env:
          AURORA_SYNC_SECRET_ARN: ${{ secrets.AURORA_SYNC_SECRET_ARN_DEV }}
          RDS_PROXY_ENDPOINT:     ${{ secrets.RDS_PROXY_ENDPOINT_DEV }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - name: Terraform workspace dev + apply
        run: |
          cd infrastructure/terraform
          terraform init -input=false
          terraform workspace select dev || terraform workspace new dev
          terraform apply -auto-approve -input=false \
            -var=env=dev \
            -var=aurora_cluster_identifier=aurora-pg-asap-dev \
            -var=telegram_secret_arn=${{ secrets.TELEGRAM_SECRET_ARN_DEV }} \
            -var=agentcore_agent_id=${{ secrets.AGENTCORE_AGENT_ID_DEV }}
      - run: agentcore deploy --env dev
