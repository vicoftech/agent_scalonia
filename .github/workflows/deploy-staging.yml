name: Deploy Staging
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - run: |
          pip install poetry bedrock-agentcore-starter-toolkit
          poetry install
      - name: Run Alembic migrations
        run: poetry run alembic upgrade head
        env:
          AURORA_SYNC_SECRET_ARN: ${{ secrets.AURORA_SYNC_SECRET_ARN_STAGING }}
          RDS_PROXY_ENDPOINT: ${{ secrets.RDS_PROXY_ENDPOINT_STAGING }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - run: terraform -chdir=infrastructure/terraform init -input=false
      - run: |
          terraform -chdir=infrastructure/terraform apply -auto-approve -input=false \
            -var=env=staging \
            -var=telegram_secret_arn=${{ secrets.TELEGRAM_SECRET_ARN_STAGING }} \
            -var=agentcore_agent_id=${{ secrets.AGENTCORE_AGENT_ID_STAGING }} \
            -var=aurora_cluster_identifier=${{ secrets.AURORA_CLUSTER_IDENTIFIER_STAGING }}
      - run: agentcore deploy --env staging
