name: Deploy Staging
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - run: poetry install
      - name: Run Alembic migrations
        run: poetry run alembic upgrade head
        env:
          AURORA_SYNC_SECRET_ARN: ${{ secrets.AURORA_SYNC_SECRET_ARN_STAGING }}
          RDS_PROXY_ENDPOINT: ${{ secrets.RDS_PROXY_ENDPOINT_STAGING }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - name: Terraform apply (incl. AgentCore Runtime)
        run: |
          cd infrastructure/terraform
          chmod +x bin/*.sh
          make prepare
          terraform init -input=false
          terraform workspace select staging || terraform workspace new staging
          terraform apply -auto-approve -input=false \
            -var=env=staging \
            -var=telegram_secret_arn=${{ secrets.TELEGRAM_SECRET_ARN_STAGING }} \
            -var=aurora_cluster_identifier=${{ secrets.AURORA_CLUSTER_IDENTIFIER_STAGING }} \
            -var=terraform_state_bucket=${{ secrets.TF_STATE_BUCKET_STAGING }} \
            -var=terraform_state_lock_table=${{ secrets.TF_STATE_LOCK_TABLE_STAGING }} \
            -var=terraform_state_key=prode/terraform.tfstate
