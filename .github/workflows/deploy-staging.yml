name: Deploy Staging

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "infrastructure/lambdas/**"
      - "src/**"
      - "requirements-agent.txt"
      - "pyproject.toml"
      - "poetry.lock"
      - "infrastructure/terraform/**"
      - ".github/workflows/deploy-staging.yml"
      - ".github/workflows/reusable-terraform-apply.yml"
  workflow_dispatch:

jobs:
  deploy:
    environment: staging
    uses: ./.github/workflows/reusable-terraform-apply.yml
    with:
      environment_name: staging
      terraform_workspace: staging
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_STAGING }}
      STAGING_TFVARS: ${{ secrets.STAGING_TFVARS }}
      TELEGRAM_SECRET_ARN: ${{ secrets.TELEGRAM_SECRET_ARN_STAGING }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET_STAGING }}
      TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE_STAGING }}
