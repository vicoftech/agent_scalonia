[tool.poetry]
name        = "prode-mundial-2026"
version     = "0.1.0"
description = "Prode Mundial 2026 — Bedrock AgentCore + Strands + Aurora + DynamoDB"
authors     = ["Team Prode"]
python      = "^3.12"

[tool.poetry.dependencies]
python                        = "^3.12"
strands-agents                = "^0.1"
strands-agents-tools          = "^0.1"
bedrock-agentcore             = "^1.6"
bedrock-agentcore-starter-toolkit = "^0.3"
boto3                         = "^1.38"
pydantic                      = "^2.7"
httpx                         = "^0.27"
sqlalchemy                    = {extras = ["asyncio"], version = "^2.0"}
asyncpg                       = "^0.29"
alembic                       = "^1.13"

[tool.poetry.group.dev.dependencies]
pytest           = "^8.2"
pytest-cov       = "^5.0"
pytest-asyncio   = "^0.23"
moto             = {extras = ["dynamodb", "scheduler", "sqs", "sns", "secretsmanager"], version = "^5.0"}
pytest-postgresql = "^6.0"
black            = "^24.0"
ruff             = "^0.4"
mypy             = "^1.10"
respx            = "^0.21"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"
addopts      = "--cov=src --cov=agent --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
select      = ["E", "F", "I", "N", "W"]

[tool.black]
line-length    = 100
target-version = ["py312"]
